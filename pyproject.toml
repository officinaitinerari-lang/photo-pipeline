[project]
name = "photo-pipeline"
version = "1.0.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 165
target-version = "py311"
extend-exclude = [".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
